name: Public US VPN Node

on:
  workflow_dispatch:

jobs:
  run-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --advertise-exit-node --hostname=gh-public-vpn

      - name: Keep Alive Loop
        run: |
          echo "VPN Node is Active. Remember the 6-hour hard cutoff limit."
          while true; do
            echo "[$(date)] Running..."
            sleep 300
          done
